<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐹 Cobaya Comilona 🥕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 2.5em;
            color: #ff6b9d;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #fff, 6px 6px 0 #ffc7e5;
        }

        .emoji {
            font-size: 4em;
            margin: 10px 0;
        }

        .instructions {
            background: #fff;
            border: 4px solid #ff6b9d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            max-width: 350px;
        }

        .instructions h2 {
            color: #ff6b9d;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .instructions p {
            color: #333;
            margin: 10px 0;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .food-examples {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .food-group {
            text-align: center;
        }

        .food-group .label {
            font-weight: bold;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .good {
            color: #4CAF50;
        }

        .bad {
            color: #f44336;
        }

        button {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            margin: 10px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        #scoreDisplay {
            font-size: 3em;
            color: #ff6b9d;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 0 white, 4px 4px 0 #ffc7e5;
        }

        @media (max-width: 480px) {
            #gameContainer {
                border-radius: 0;
                max-height: 100vh;
            }

            h1 {
                font-size: 2em;
            }

            button {
                font-size: 1.2em;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen">
            <h1>🐹 Cobaya Comilona 🥕</h1>
            <div class="emoji">🐹</div>

            <div class="instructions">
                <h2>📖 Cómo Jugar</h2>
                <p><strong>Toca y arrastra</strong> para mover a la cobaya</p>
                <p>¡Atrapa la comida buena! 🥕🥬🌱</p>
                <p>¡Evita la comida mala! 🍫🍬🍭</p>

                <div class="food-examples">
                    <div class="food-group">
                        <div style="font-size: 2em;">🥕🥬🌱</div>
                        <div class="label good">¡BUENA! +10</div>
                    </div>
                    <div class="food-group">
                        <div style="font-size: 2em;">🍫🍬🍭</div>
                        <div class="label bad">¡MALA! -1❤️</div>
                    </div>
                </div>

                <p style="margin-top: 15px;">💚 Tienes 3 vidas</p>
                <p>⚡ ¡La velocidad aumenta!</p>
            </div>

            <button id="startButton">¡JUGAR!</button>
        </div>

        <div id="gameOverScreen">
            <h1>¡Fin del Juego!</h1>
            <div class="emoji">🐹</div>
            <div id="scoreDisplay">0</div>
            <p style="font-size: 1.3em; color: #666; margin: 10px 0;">puntos</p>
            <button id="restartButton">Jugar Otra Vez</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const scoreDisplay = document.getElementById('scoreDisplay');

        // Ajustar tamaño del canvas
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Estado del juego
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let score = 0;
        let lives = 3;
        let gameSpeed = 1;
        let lastSpeedIncrease = 0;

        // Cobaya (jugador)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 60,
            height: 50,
            speed: 8,
            targetX: canvas.width / 2
        };

        // Array de comidas cayendo
        let fallingFoods = [];

        // Tipos de comida
        const goodFoods = ['🥕', '🥬', '🌱', '🥒', '🫑', '🍅'];
        const badFoods = ['🍫', '🍬', '🍭', '🍰', '🍪'];

        // Configuración de spawn
        let lastSpawnTime = 0;
        const spawnInterval = 1000; // milliseconds

        // Control táctil y mouse
        let isDragging = false;

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);

        function handleStart(e) {
            if (gameState !== 'playing') return;
            e.preventDefault();
            isDragging = true;
            updatePlayerTarget(e);
        }

        function handleMove(e) {
            if (gameState !== 'playing' || !isDragging) return;
            e.preventDefault();
            updatePlayerTarget(e);
        }

        function handleEnd(e) {
            e.preventDefault();
            isDragging = false;
        }

        function updatePlayerTarget(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX;

            if (e.touches) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            const x = clientX - rect.left;
            player.targetX = Math.max(player.width / 2, Math.min(x, canvas.width - player.width / 2));
        }

        // Botones
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);

        function startGame() {
            gameState = 'playing';
            score = 0;
            lives = 3;
            gameSpeed = 1;
            lastSpeedIncrease = 0;
            fallingFoods = [];
            lastSpawnTime = Date.now();
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            gameLoop();
        }

        function endGame() {
            gameState = 'gameover';
            scoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        // Crear comida cayendo
        function spawnFood() {
            const now = Date.now();
            if (now - lastSpawnTime < spawnInterval / gameSpeed) return;

            lastSpawnTime = now;

            const isGood = Math.random() > 0.3; // 70% buena, 30% mala
            const foodArray = isGood ? goodFoods : badFoods;
            const emoji = foodArray[Math.floor(Math.random() * foodArray.length)];

            fallingFoods.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -40,
                width: 40,
                height: 40,
                emoji: emoji,
                isGood: isGood,
                speed: 2 + gameSpeed * 0.5
            });
        }

        // Actualizar posiciones
        function update() {
            if (gameState !== 'playing') return;

            // Mover jugador hacia el objetivo
            const dx = player.targetX - player.x;
            if (Math.abs(dx) > 1) {
                player.x += dx * 0.2; // Suavizado del movimiento
            }

            // Actualizar comidas
            for (let i = fallingFoods.length - 1; i >= 0; i--) {
                const food = fallingFoods[i];
                food.y += food.speed;

                // Comprobar colisión con jugador
                if (checkCollision(player, food)) {
                    if (food.isGood) {
                        score += 10;
                    } else {
                        lives--;
                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                    fallingFoods.splice(i, 1);
                    continue;
                }

                // Eliminar si sale de pantalla
                if (food.y > canvas.height) {
                    fallingFoods.splice(i, 1);
                }
            }

            // Aumentar velocidad cada 200 puntos
            if (score - lastSpeedIncrease >= 200) {
                gameSpeed += 0.3;
                lastSpeedIncrease = score;
            }

            // Generar nueva comida
            spawnFood();
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Dibujar todo
        function draw() {
            // Limpiar canvas
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar césped en el suelo
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

            if (gameState !== 'playing') return;

            // Dibujar cobaya (jugador)
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐹', player.x, player.y);

            // Dibujar comidas cayendo
            ctx.font = '40px Arial';
            fallingFoods.forEach(food => {
                ctx.fillText(food.emoji, food.x, food.y);
            });

            // Dibujar HUD (puntuación y vidas)
            ctx.font = 'bold 28px Comic Sans MS';
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.textAlign = 'left';

            const hudText = `Puntos: ${score}`;
            ctx.strokeText(hudText, 15, 35);
            ctx.fillText(hudText, 15, 35);

            ctx.textAlign = 'right';
            const livesText = '❤️'.repeat(lives);
            ctx.fillText(livesText, canvas.width - 15, 35);
        }

        // Loop principal
        function gameLoop() {
            update();
            draw();

            if (gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        // Dibujar pantalla inicial
        draw();
    </script>
</body>
</html>
