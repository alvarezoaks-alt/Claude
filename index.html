<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐹 Juegos de Cobaya 🎮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        #menuScreen {
            display: flex;
        }

        h1 {
            font-size: 2.5em;
            color: #ff6b9d;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #fff, 6px 6px 0 #ffc7e5;
        }

        h2 {
            font-size: 1.8em;
            color: #ff6b9d;
            margin: 15px 0;
        }

        .emoji {
            font-size: 4em;
            margin: 10px 0;
        }

        .game-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .game-card {
            background: white;
            border: 4px solid #ff6b9d;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            max-width: 350px;
        }

        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .game-card h2 {
            color: #ff6b9d;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .game-card p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.4;
        }

        .instructions {
            background: #fff;
            border: 4px solid #ff6b9d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            max-width: 350px;
        }

        .instructions h2 {
            color: #ff6b9d;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .instructions p {
            color: #333;
            margin: 10px 0;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .food-examples {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .food-group {
            text-align: center;
        }

        .food-group .label {
            font-weight: bold;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .good {
            color: #4CAF50;
        }

        .bad {
            color: #f44336;
        }

        button {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            margin: 10px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 1.2em;
            padding: 15px 30px;
        }

        button.small {
            font-size: 1em;
            padding: 12px 25px;
        }

        #scoreDisplay {
            font-size: 3em;
            color: #ff6b9d;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 0 white, 4px 4px 0 #ffc7e5;
        }

        #gameTitle {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 10px;
        }

        .name-input-container {
            background: white;
            border: 4px solid #ff6b9d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            max-width: 350px;
        }

        .name-input-container input {
            font-family: inherit;
            font-size: 1.3em;
            padding: 15px;
            border: 3px solid #ffc7e5;
            border-radius: 10px;
            width: 100%;
            max-width: 250px;
            text-align: center;
            margin: 10px 0;
        }

        .name-input-container input:focus {
            outline: none;
            border-color: #ff6b9d;
        }

        .ranking-table {
            background: white;
            border: 4px solid #ff6b9d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            max-width: 400px;
            width: 100%;
            max-height: 500px;
            overflow-y: auto;
        }

        .ranking-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .ranking-tabs button {
            font-size: 1em;
            padding: 10px 20px;
        }

        .ranking-tabs button.active {
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
        }

        .ranking-list {
            list-style: none;
            padding: 0;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f9f9f9;
            border-radius: 10px;
            border: 2px solid #ffc7e5;
        }

        .ranking-item.top1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-color: #FF8C00;
        }

        .ranking-item.top2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #A9A9A9 100%);
            border-color: #808080;
        }

        .ranking-item.top3 {
            background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%);
            border-color: #8B4513;
        }

        .ranking-position {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff6b9d;
            min-width: 40px;
        }

        .ranking-name {
            flex: 1;
            font-size: 1.2em;
            color: #333;
            text-align: left;
            margin: 0 10px;
        }

        .ranking-score {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .empty-ranking {
            color: #999;
            font-size: 1.2em;
            padding: 30px;
        }

        @media (max-width: 480px) {
            #gameContainer {
                border-radius: 0;
                max-height: 100vh;
            }

            h1 {
                font-size: 2em;
            }

            button {
                font-size: 1.2em;
                padding: 15px 30px;
            }

            .game-card h2 {
                font-size: 1.5em;
            }

            .ranking-item {
                padding: 10px;
            }

            .ranking-name {
                font-size: 1em;
            }

            .ranking-score {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Menú Principal -->
        <div id="menuScreen" class="screen">
            <h1>🐹 Juegos de Cobaya 🎮</h1>
            <div class="emoji">🐹</div>

            <div class="game-selection">
                <div class="game-card" id="selectComilona">
                    <h2>🥕 Cobaya Comilona</h2>
                    <p>¡Atrapa comida buena y evita la mala! Arrastra para mover la cobaya.</p>
                </div>

                <div class="game-card" id="selectAtleta">
                    <h2>🏃 Cobaya Atleta</h2>
                    <p>¡Salta obstáculos y corre sin parar! Toca para saltar.</p>
                </div>
            </div>

            <button class="secondary small" id="showRankingButton">🏆 Ver Ranking</button>
        </div>

        <!-- Pantalla de Inicio del Juego -->
        <div id="startScreen" class="screen">
            <h1 id="gameTitle">Juego</h1>
            <div class="emoji">🐹</div>
            <div id="instructionsContainer"></div>
            <button id="startButton">¡JUGAR!</button>
            <button class="secondary" id="backToMenuFromStart">Volver al Menú</button>
        </div>

        <!-- Pantalla de Fin del Juego -->
        <div id="gameOverScreen" class="screen">
            <h1>¡Fin del Juego!</h1>
            <div class="emoji">🐹</div>
            <div id="scoreDisplay">0</div>
            <p style="font-size: 1.3em; color: #666; margin: 10px 0;">puntos</p>

            <div class="name-input-container">
                <p style="color: #666; font-size: 1.2em; margin-bottom: 10px;">✏️ ¿Cómo te llamas?</p>
                <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="15">
                <button id="saveScoreButton" style="margin-top: 10px;">💾 Guardar Puntuación</button>
            </div>

            <button id="restartButton">Jugar Otra Vez</button>
            <button class="secondary" id="backToMenuFromGameOver">Volver al Menú</button>
        </div>

        <!-- Pantalla de Ranking -->
        <div id="rankingScreen" class="screen">
            <h1>🏆 Ranking de Puntuaciones</h1>

            <div class="ranking-tabs">
                <button id="rankingComilona" class="active">🥕 Comilona</button>
                <button id="rankingAtleta">🏃 Atleta</button>
            </div>

            <div class="ranking-table">
                <ul class="ranking-list" id="rankingList">
                    <!-- Las puntuaciones se insertarán aquí dinámicamente -->
                </ul>
            </div>

            <button class="secondary" id="backToMenuFromRanking">Volver al Menú</button>
            <button class="secondary small" id="clearRankingButton">🗑️ Borrar Ranking</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuScreen = document.getElementById('menuScreen');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const rankingScreen = document.getElementById('rankingScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameTitle = document.getElementById('gameTitle');
        const instructionsContainer = document.getElementById('instructionsContainer');
        const playerNameInput = document.getElementById('playerNameInput');
        const rankingList = document.getElementById('rankingList');

        // Botones
        const selectComilona = document.getElementById('selectComilona');
        const selectAtleta = document.getElementById('selectAtleta');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const saveScoreButton = document.getElementById('saveScoreButton');
        const showRankingButton = document.getElementById('showRankingButton');
        const backToMenuFromStart = document.getElementById('backToMenuFromStart');
        const backToMenuFromGameOver = document.getElementById('backToMenuFromGameOver');
        const backToMenuFromRanking = document.getElementById('backToMenuFromRanking');
        const rankingComilona = document.getElementById('rankingComilona');
        const rankingAtleta = document.getElementById('rankingAtleta');
        const clearRankingButton = document.getElementById('clearRankingButton');

        // Ajustar tamaño del canvas
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Estado general
        let currentGame = null; // 'comilona' o 'atleta'
        let gameState = 'menu'; // 'menu', 'start', 'playing', 'gameover', 'ranking'
        let score = 0;
        let lives = 3;
        let gameSpeed = 1;
        let lastSpeedIncrease = 0;
        let currentRankingView = 'comilona';
        let scoreSaved = false;

        // Variables para Cobaya Comilona
        let fallingFoods = [];
        let lastSpawnTime = 0;
        const spawnInterval = 1000;
        const goodFoods = ['🥕', '🥬', '🌱', '🥒', '🫑', '🍅'];
        const badFoods = ['🍫', '🍬', '🍭', '🍰', '🍪'];
        let isDragging = false;

        // Variables para Cobaya Atleta
        let obstacles = [];
        let lastObstacleTime = 0;
        const obstacleInterval = 2000;
        const obstacleTypes = ['🪨', '🌳', '🪵', '🌵'];
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.8;
        const jumpPower = -15;
        let distanceTraveled = 0;

        // Cobaya (jugador)
        const player = {
            x: 0,
            y: 0,
            width: 60,
            height: 50,
            speed: 8,
            targetX: 0,
            velocityY: 0,
            groundY: 0
        };

        // ===== SISTEMA DE RANKING =====
        function saveScore(name, score, game) {
            const scores = getScores();

            scores.push({
                name: name,
                score: score,
                game: game,
                date: new Date().toISOString()
            });

            // Ordenar por puntuación descendente
            scores.sort((a, b) => b.score - a.score);

            // Guardar en localStorage
            localStorage.setItem('guineaPigScores', JSON.stringify(scores));
        }

        function getScores() {
            const stored = localStorage.getItem('guineaPigScores');
            return stored ? JSON.parse(stored) : [];
        }

        function getTopScores(game, limit = 10) {
            const allScores = getScores();
            return allScores
                .filter(s => s.game === game)
                .slice(0, limit);
        }

        function clearScores() {
            if (confirm('¿Seguro que quieres borrar todas las puntuaciones?')) {
                localStorage.removeItem('guineaPigScores');
                displayRanking(currentRankingView);
            }
        }

        function displayRanking(game) {
            currentRankingView = game;
            const scores = getTopScores(game);

            rankingList.innerHTML = '';

            if (scores.length === 0) {
                rankingList.innerHTML = '<li class="empty-ranking">¡Aún no hay puntuaciones! 🎮<br>¡Sé el primero en jugar!</li>';
                return;
            }

            scores.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = 'ranking-item';

                if (index === 0) li.classList.add('top1');
                else if (index === 1) li.classList.add('top2');
                else if (index === 2) li.classList.add('top3');

                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';

                li.innerHTML = `
                    <span class="ranking-position">${medal} ${index + 1}</span>
                    <span class="ranking-name">${entry.name}</span>
                    <span class="ranking-score">${entry.score}</span>
                `;

                rankingList.appendChild(li);
            });
        }

        // Event Listeners para selección de juego
        selectComilona.addEventListener('click', () => {
            currentGame = 'comilona';
            showStartScreen();
        });

        selectAtleta.addEventListener('click', () => {
            currentGame = 'atleta';
            showStartScreen();
        });

        // Event Listeners para botones
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        backToMenuFromStart.addEventListener('click', showMenu);
        backToMenuFromGameOver.addEventListener('click', showMenu);
        backToMenuFromRanking.addEventListener('click', showMenu);
        showRankingButton.addEventListener('click', showRanking);
        clearRankingButton.addEventListener('click', clearScores);

        saveScoreButton.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            if (name === '') {
                alert('¡Por favor escribe tu nombre!');
                return;
            }

            saveScore(name, score, currentGame);
            scoreSaved = true;
            saveScoreButton.textContent = '✅ ¡Guardado!';
            saveScoreButton.disabled = true;

            // Mostrar ranking después de guardar
            setTimeout(() => {
                currentRankingView = currentGame;
                showRanking();
            }, 1000);
        });

        rankingComilona.addEventListener('click', () => {
            rankingComilona.classList.add('active');
            rankingAtleta.classList.remove('active');
            displayRanking('comilona');
        });

        rankingAtleta.addEventListener('click', () => {
            rankingAtleta.classList.add('active');
            rankingComilona.classList.remove('active');
            displayRanking('atleta');
        });

        // Control táctil y mouse
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, {passive: false});

        function handleInput(e) {
            e.preventDefault();

            if (gameState !== 'playing') return;

            if (currentGame === 'comilona') {
                isDragging = true;
                updatePlayerTarget(e);
                canvas.addEventListener('mousemove', handleMove);
                canvas.addEventListener('touchmove', handleMove, {passive: false});
            } else if (currentGame === 'atleta') {
                jump();
            }
        }

        function handleMove(e) {
            if (gameState !== 'playing' || !isDragging) return;
            e.preventDefault();
            updatePlayerTarget(e);
        }

        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchend', handleEnd);

        function handleEnd(e) {
            e.preventDefault();
            isDragging = false;
            canvas.removeEventListener('mousemove', handleMove);
            canvas.removeEventListener('touchmove', handleMove);
        }

        function updatePlayerTarget(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX;

            if (e.touches) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            const x = clientX - rect.left;
            player.targetX = Math.max(player.width / 2, Math.min(x, canvas.width - player.width / 2));
        }

        function jump() {
            if (!isJumping) {
                isJumping = true;
                player.velocityY = jumpPower;
            }
        }

        // Navegación de pantallas
        function showMenu() {
            gameState = 'menu';
            currentGame = null;
            menuScreen.style.display = 'flex';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            rankingScreen.style.display = 'none';
        }

        function showStartScreen() {
            gameState = 'start';
            menuScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            gameOverScreen.style.display = 'none';
            rankingScreen.style.display = 'none';

            if (currentGame === 'comilona') {
                gameTitle.textContent = '🥕 Cobaya Comilona';
                instructionsContainer.innerHTML = `
                    <div class="instructions">
                        <h2>📖 Cómo Jugar</h2>
                        <p><strong>Toca y arrastra</strong> para mover a la cobaya</p>
                        <p>¡Atrapa la comida buena! 🥕🥬🌱</p>
                        <p>¡Evita la comida mala! 🍫🍬🍭</p>
                        <div class="food-examples">
                            <div class="food-group">
                                <div style="font-size: 2em;">🥕🥬🌱</div>
                                <div class="label good">¡BUENA! +10</div>
                            </div>
                            <div class="food-group">
                                <div style="font-size: 2em;">🍫🍬🍭</div>
                                <div class="label bad">¡MALA! -1❤️</div>
                            </div>
                        </div>
                        <p style="margin-top: 15px;">💚 Tienes 3 vidas</p>
                        <p>⚠️ ¡No dejes caer la comida buena!</p>
                        <p>⚡ ¡La velocidad aumenta!</p>
                    </div>
                `;
            } else if (currentGame === 'atleta') {
                gameTitle.textContent = '🏃 Cobaya Atleta';
                instructionsContainer.innerHTML = `
                    <div class="instructions">
                        <h2>📖 Cómo Jugar</h2>
                        <p><strong>Toca la pantalla</strong> para saltar</p>
                        <p>¡Evita los obstáculos! 🪨🌳🪵</p>
                        <p>Ganas 10 puntos por cada obstáculo evitado</p>
                        <p style="margin-top: 15px;">💚 Tienes 3 vidas</p>
                        <p>⚡ ¡La velocidad aumenta cada 500 puntos!</p>
                        <p>🏃 ¡Corre sin parar!</p>
                    </div>
                `;
            }
        }

        function showRanking() {
            gameState = 'ranking';
            menuScreen.style.display = 'none';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            rankingScreen.style.display = 'flex';

            // Actualizar los botones de tabs
            if (currentRankingView === 'comilona') {
                rankingComilona.classList.add('active');
                rankingAtleta.classList.remove('active');
            } else {
                rankingAtleta.classList.add('active');
                rankingComilona.classList.remove('active');
            }

            displayRanking(currentRankingView);
        }

        function startGame() {
            gameState = 'playing';
            score = 0;
            lives = 3;
            gameSpeed = 1;
            lastSpeedIncrease = 0;
            distanceTraveled = 0;
            scoreSaved = false;

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            if (currentGame === 'comilona') {
                initComilona();
            } else if (currentGame === 'atleta') {
                initAtleta();
            }

            gameLoop();
        }

        function initComilona() {
            fallingFoods = [];
            lastSpawnTime = Date.now();
            isDragging = false;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.targetX = canvas.width / 2;
        }

        function initAtleta() {
            obstacles = [];
            lastObstacleTime = Date.now();
            isJumping = false;
            player.velocityY = 0;
            player.x = 100;
            player.groundY = canvas.height - 110;
            player.y = player.groundY;
        }

        function endGame() {
            gameState = 'gameover';
            scoreDisplay.textContent = score;
            playerNameInput.value = '';
            saveScoreButton.textContent = '💾 Guardar Puntuación';
            saveScoreButton.disabled = false;
            gameOverScreen.style.display = 'flex';
        }

        // ===== COBAYA COMILONA =====
        function updateComilona() {
            // Mover jugador hacia el objetivo
            const dx = player.targetX - player.x;
            if (Math.abs(dx) > 1) {
                player.x += dx * 0.2;
            }

            // Actualizar comidas
            for (let i = fallingFoods.length - 1; i >= 0; i--) {
                const food = fallingFoods[i];
                food.y += food.speed;

                // Comprobar colisión
                if (checkCollision(player, food)) {
                    if (food.isGood) {
                        score += 10;
                    } else {
                        lives--;
                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                    fallingFoods.splice(i, 1);
                    continue;
                }

                // Eliminar si sale de pantalla
                if (food.y > canvas.height) {
                    // Si es comida buena y se escapa, perder una vida
                    if (food.isGood) {
                        lives--;
                        if (lives <= 0) {
                            endGame();
                            return;
                        }
                    }
                    fallingFoods.splice(i, 1);
                }
            }

            // Aumentar velocidad
            if (score - lastSpeedIncrease >= 200) {
                gameSpeed += 0.3;
                lastSpeedIncrease = score;
            }

            // Generar comida
            spawnFood();
        }

        function spawnFood() {
            const now = Date.now();
            if (now - lastSpawnTime < spawnInterval / gameSpeed) return;

            lastSpawnTime = now;

            const isGood = Math.random() > 0.3;
            const foodArray = isGood ? goodFoods : badFoods;
            const emoji = foodArray[Math.floor(Math.random() * foodArray.length)];

            fallingFoods.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -40,
                width: 40,
                height: 40,
                emoji: emoji,
                isGood: isGood,
                speed: 2 + gameSpeed * 0.5
            });
        }

        function drawComilona() {
            // Dibujar cobaya
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐹', player.x, player.y);

            // Dibujar comidas
            ctx.font = '40px Arial';
            fallingFoods.forEach(food => {
                ctx.fillText(food.emoji, food.x, food.y);
            });

            // HUD
            drawHUD();
        }

        // ===== COBAYA ATLETA =====
        function updateAtleta() {
            // Física del salto
            if (isJumping || player.y < player.groundY) {
                player.velocityY += gravity;
                player.y += player.velocityY;

                if (player.y >= player.groundY) {
                    player.y = player.groundY;
                    player.velocityY = 0;
                    isJumping = false;
                }
            }

            // Actualizar obstáculos
            distanceTraveled += gameSpeed;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.x -= 5 * gameSpeed;

                // Comprobar colisión
                if (checkCollision(player, obstacle)) {
                    lives--;
                    obstacles.splice(i, 1);
                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                    continue;
                }

                // Dar puntos si pasó el obstáculo
                if (!obstacle.passed && obstacle.x + obstacle.width < player.x) {
                    obstacle.passed = true;
                    score += 10;
                }

                // Eliminar si sale de pantalla
                if (obstacle.x + obstacle.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Aumentar velocidad
            if (score - lastSpeedIncrease >= 500) {
                gameSpeed += 0.2;
                lastSpeedIncrease = score;
            }

            // Generar obstáculos
            spawnObstacle();
        }

        function spawnObstacle() {
            const now = Date.now();
            if (now - lastObstacleTime < obstacleInterval / gameSpeed) return;

            lastObstacleTime = now;

            const emoji = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];

            obstacles.push({
                x: canvas.width,
                y: player.groundY,
                width: 50,
                height: 50,
                emoji: emoji,
                passed: false
            });
        }

        function drawAtleta() {
            // Dibujar cobaya
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐹', player.x, player.y);

            // Dibujar obstáculos
            ctx.font = '50px Arial';
            obstacles.forEach(obstacle => {
                ctx.fillText(obstacle.emoji, obstacle.x, obstacle.y);
            });

            // HUD
            drawHUD();
        }

        // ===== FUNCIONES COMUNES =====
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function drawHUD() {
            ctx.font = 'bold 28px Comic Sans MS';
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.textAlign = 'left';

            const hudText = `Puntos: ${score}`;
            ctx.strokeText(hudText, 15, 35);
            ctx.fillText(hudText, 15, 35);

            ctx.textAlign = 'right';
            const livesText = '❤️'.repeat(lives);
            ctx.fillText(livesText, canvas.width - 15, 35);
        }

        function update() {
            if (gameState !== 'playing') return;

            if (currentGame === 'comilona') {
                updateComilona();
            } else if (currentGame === 'atleta') {
                updateAtleta();
            }
        }

        function draw() {
            // Limpiar canvas
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar césped
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

            if (gameState !== 'playing') return;

            if (currentGame === 'comilona') {
                drawComilona();
            } else if (currentGame === 'atleta') {
                drawAtleta();
            }
        }

        // Loop principal
        function gameLoop() {
            update();
            draw();

            if (gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        // Inicializar
        draw();
    </script>
</body>
</html>
